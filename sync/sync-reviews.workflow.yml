name: Sync Google reviews
on:
  schedule:
    - cron: '0 6 * * *'   # daily, 6am UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node sync/sync-google-reviews.mjs
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
      - name: Commit if changed
        run: |
          git config user.name "reviews-bot"
          git config user.email "reviews-bot@users.noreply.github.com"
          git add data/reviews.js
          git diff --cached --quiet || git commit -m "chore: sync Google reviews" && git push
